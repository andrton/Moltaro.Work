<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 196" width="840" height="196" role="img" aria-labelledby="run-title run-desc">
  <title id="run-title">Run: kept with its outcome</title>
  <desc id="run-desc">The optional key nightly-import. An enqueue creates an item, which waits and then runs. A second enqueue with the same key while the item is active adds nothing. After success the item is kept with its outcome, completed, enqueued 10:00, finished 10:03, for the queue's retention.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 16px; fill: #f0f6fc; }
    .h { font-size: 20px; font-weight: 600; }
    .m { font-size: 15px; fill: #9198a1; }
    .k { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #f0f6fc; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .line { stroke: #3d444d; stroke-width: 2; }
    .wait { fill: #132339; stroke: #4493f8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .run { fill: #12301c; stroke: #3fb950; stroke-width: 1.5; }
    .rt { fill: #7ee787; font-weight: 600; }
    .enq { fill: #4493f8; }
    .arr { stroke: #4493f8; stroke-width: 2; }
    .none { fill: none; stroke: #9198a1; stroke-width: 2; }
    .stop { stroke: #9198a1; stroke-width: 2; stroke-dasharray: 3 3; }
    .mark { fill: #d29922; }
    .mt { font-size: 15px; font-weight: 600; fill: #d29922; }
    .del { fill: none; stroke: #9198a1; stroke-width: 2; }
    .card { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
    .ok { fill: #3fb950; font-weight: 600; }
  </style>
  <text class="h" x="0" y="24">Run</text>
  <text class="m e" x="840" y="24">optional key <tspan class="k">nightly-import</tspan></text>
  <line class="line" x1="76" y1="136" x2="440" y2="136"/>
  <text x="0" y="141">enqueue</text>
  <circle class="enq" cx="76" cy="136" r="6"/>
  <line class="arr" x1="82" y1="136" x2="93" y2="136"/>
  <polygon class="enq" points="92,131 92,141 101,136"/>
  <text class="m c" x="323" y="62">same key: adds nothing</text>
  <circle class="none" cx="323" cy="82" r="6"/>
  <line class="stop" x1="323" y1="90" x2="323" y2="111"/>
  <rect class="wait" x="102" y="114" width="116" height="44" rx="8"/>
  <text class="c" x="160" y="141">waits</text>
  <rect class="run" x="228" y="114" width="190" height="44" rx="8"/>
  <text class="rt c" x="323" y="141">run</text>
  <rect class="card" x="440" y="114" width="398" height="44" rx="8"/>
  <text class="c" x="639" y="141"><tspan class="ok">completed</tspan> · enqueued 10:00 · finished 10:03</text>
  <text class="m c" x="639" y="182">after success: kept for the queue's retention</text>
</svg>
