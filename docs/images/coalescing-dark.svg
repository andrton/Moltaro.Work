<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 232" width="840" height="232" role="img" aria-labelledby="coalescing-title coalescing-desc">
  <title id="coalescing-title">Coalescing: one item per key</title>
  <desc id="coalescing-desc">The key invoice-42. Three enqueues while the item waits leave that one item, which runs. Two enqueues during the run add one mark, so exactly one more run follows, and then the item is deleted. The enqueues during a run cost one more run, not one per enqueue.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 16px; fill: #f0f6fc; }
    .h { font-size: 20px; font-weight: 600; }
    .m { font-size: 15px; fill: #9198a1; }
    .k { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #f0f6fc; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .line { stroke: #3d444d; stroke-width: 2; }
    .wait { fill: #132339; stroke: #4493f8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .run { fill: #12301c; stroke: #3fb950; stroke-width: 1.5; }
    .rt { fill: #7ee787; font-weight: 600; }
    .enq { fill: #4493f8; }
    .arr { stroke: #4493f8; stroke-width: 2; }
    .none { fill: none; stroke: #9198a1; stroke-width: 2; }
    .stop { stroke: #9198a1; stroke-width: 2; stroke-dasharray: 3 3; }
    .mark { fill: #d29922; }
    .mt { font-size: 15px; font-weight: 600; fill: #d29922; }
    .del { fill: none; stroke: #9198a1; stroke-width: 2; }
    .card { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
    .ok { fill: #3fb950; font-weight: 600; }
  </style>
  <text class="h" x="0" y="24">Coalescing</text>
  <text class="m e" x="840" y="24">key <tspan class="k">invoice-42</tspan></text>
  <line class="line" x1="1" y1="136" x2="733" y2="136"/>
  <text class="m c" x="120" y="62">3 enqueues while it waits</text>
  <text class="m c" x="376" y="62">2 enqueues during the run</text>
  <circle class="enq" cx="50" cy="82" r="6"/>
  <line class="arr" x1="50" y1="88" x2="50" y2="105"/>
  <polygon class="enq" points="45,104 55,104 50,113"/>
  <circle class="enq" cx="120" cy="82" r="6"/>
  <line class="arr" x1="120" y1="88" x2="120" y2="105"/>
  <polygon class="enq" points="115,104 125,104 120,113"/>
  <circle class="enq" cx="190" cy="82" r="6"/>
  <line class="arr" x1="190" y1="88" x2="190" y2="105"/>
  <polygon class="enq" points="185,104 195,104 190,113"/>
  <circle class="enq" cx="336" cy="82" r="6"/>
  <line class="arr" x1="336" y1="88" x2="336" y2="105"/>
  <polygon class="enq" points="331,104 341,104 336,113"/>
  <circle class="enq" cx="416" cy="82" r="6"/>
  <line class="arr" x1="416" y1="88" x2="416" y2="105"/>
  <polygon class="enq" points="411,104 421,104 416,113"/>
  <rect class="wait" x="1" y="114" width="239" height="44" rx="8"/>
  <text class="c" x="120.5" y="141">waits</text>
  <rect class="run" x="256" y="114" width="240" height="44" rx="8"/>
  <text class="rt c" x="376" y="141">run</text>
  <polygon class="mark" points="520,124 532,136 520,148 508,136"/>
  <rect class="run" x="544" y="114" width="176" height="44" rx="8"/>
  <text class="rt c" x="632" y="141">one more run</text>
  <circle class="del" cx="746" cy="136" r="13"/>
  <path class="del" d="M741 131L751 141M751 131L741 141"/>
  <text x="767" y="141">deleted</text>
  <text class="m c" x="120" y="182">one item</text>
  <text class="mt c" x="520" y="182">mark: run once more</text>
  <text class="m" x="0" y="222">The enqueues during a run cost one more run, not one per enqueue.</text>
</svg>
