<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-labelledby="shapes-title shapes-desc">
  <title id="shapes-title">The three shapes of work: coalescing, log and run</title>
  <desc id="shapes-desc">Three timelines. Coalescing: five enqueues of one key become one item, which runs once; three enqueues during that run set a mark, so the item runs exactly once more and is then deleted. Log: three enqueues become three items, each runs once and each is deleted. Run: an enqueue with the key nightly-import becomes a run; a second enqueue with the same key while the first is active adds nothing; after success the run is kept with its outcome for the queue's retention.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #334155; }
    .title { font-size: 20px; font-weight: 600; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .name { font-size: 17px; font-weight: 600; fill: #0f172a; }
    .tagline { font-size: 13px; font-style: italic; fill: #475569; }
    .detail { font-size: 11.5px; fill: #64748b; }
    .label { font-size: 12px; fill: #334155; text-anchor: middle; }
    .note { font-size: 11px; fill: #64748b; }
    .under { font-size: 11px; fill: #64748b; text-anchor: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .in-item { font-size: 11.5px; fill: #2563eb; text-anchor: middle; }
    .in-run { font-size: 11.5px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .mark-text { font-size: 11px; fill: #b45309; text-anchor: middle; }
    .kept-head { font-size: 12px; font-weight: 600; fill: #15803d; }
    .kept-body { font-size: 11px; fill: #475569; }
    .legend { font-size: 12px; fill: #475569; }
    .axis { stroke: #cbd5e1; stroke-width: 1.5; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    .enqueue { fill: #2563eb; }
    .feed { fill: none; stroke: #2563eb; stroke-opacity: 0.45; stroke-width: 1.25; }
    .item { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
    .run { fill: #0f766e; }
    .mark { fill: #f59e0b; }
    .gone { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .cross { stroke: #94a3b8; stroke-width: 1.5; stroke-linecap: round; }
    .refused { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .refused-feed { stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 3 3; }
    .kept { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.25; }
  </style>
  <defs>
    <path id="arrow" d="M0 -4 L8 0 L0 4 Z" fill="#cbd5e1"/>
    <g id="deleted">
      <circle r="7" class="gone"/>
      <path d="M-3 -3 L3 3 M3 -3 L-3 3" class="cross"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="619" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="46" class="title">Three shapes, one mechanism</text>
  <text x="40" y="70" class="subtitle">Retries, leases, dead items and retention are shared. They differ in what an item means, what a second enqueue does and what remains.</text>

  <!-- Coalescing -->
  <g>
    <text x="40" y="148" class="name">Coalescing</text>
    <text x="40" y="170" class="tagline">“this object</text>
    <text x="40" y="188" class="tagline">needs attention”</text>
    <text x="40" y="212" class="detail">one item per key, no payload</text>

    <line x1="260" y1="190" x2="872" y2="190" class="axis"/>
    <use href="#arrow" x="872" y="190"/>
    <text x="872" y="180" class="note" text-anchor="end">time</text>

    <text x="310" y="124" class="label">5 enqueues of <tspan class="mono">invoice-42</tspan></text>
    <path d="M282 145 C282 162 310 160 310 177" class="feed"/>
    <path d="M296 145 C296 162 310 160 310 177" class="feed"/>
    <path d="M310 145 L310 177" class="feed"/>
    <path d="M324 145 C324 162 310 160 310 177" class="feed"/>
    <path d="M338 145 C338 162 310 160 310 177" class="feed"/>
    <circle cx="282" cy="140" r="4.5" class="enqueue"/>
    <circle cx="296" cy="140" r="4.5" class="enqueue"/>
    <circle cx="310" cy="140" r="4.5" class="enqueue"/>
    <circle cx="324" cy="140" r="4.5" class="enqueue"/>
    <circle cx="338" cy="140" r="4.5" class="enqueue"/>
    <rect x="270" y="177" width="80" height="26" rx="6" class="item"/>
    <text x="310" y="194" class="in-item">1 item</text>

    <rect x="362" y="177" width="200" height="26" rx="6" class="run"/>
    <text x="462" y="194" class="in-run">handler runs</text>

    <text x="490" y="124" class="label">3 more during the run</text>
    <path d="M460 145 L460 168 M490 145 L490 168 M520 145 L520 168" class="feed"/>
    <circle cx="460" cy="140" r="4.5" class="enqueue"/>
    <circle cx="490" cy="140" r="4.5" class="enqueue"/>
    <circle cx="520" cy="140" r="4.5" class="enqueue"/>
    <rect x="456" y="168" width="106" height="6" rx="3" class="mark"/>
    <text x="509" y="222" class="mark-text">marked: run once more</text>

    <rect x="574" y="177" width="146" height="26" rx="6" class="run"/>
    <text x="647" y="194" class="in-run">one more run</text>

    <use href="#deleted" x="746" y="190"/>
    <text x="746" y="222" class="under">deleted</text>
  </g>

  <line x1="40" y1="250" x2="880" y2="250" class="divider"/>

  <!-- Log -->
  <g>
    <text x="40" y="298" class="name">Log</text>
    <text x="40" y="320" class="tagline">“here is an event,</text>
    <text x="40" y="338" class="tagline">handle each one”</text>
    <text x="40" y="362" class="detail">one item per enqueue, payload</text>

    <line x1="260" y1="340" x2="872" y2="340" class="axis"/>
    <use href="#arrow" x="872" y="340"/>

    <text x="298" y="274" class="label">mail, order 17</text>
    <path d="M298 295 L298 327" class="feed"/>
    <circle cx="298" cy="290" r="4.5" class="enqueue"/>
    <rect x="272" y="327" width="52" height="26" rx="6" class="item"/>
    <text x="298" y="344" class="in-item">item 1</text>
    <rect x="332" y="327" width="80" height="26" rx="6" class="run"/>
    <text x="372" y="344" class="in-run">runs</text>
    <use href="#deleted" x="432" y="340"/>
    <text x="432" y="372" class="under">deleted</text>

    <text x="496" y="274" class="label">webhook, order 18</text>
    <path d="M496 295 L496 327" class="feed"/>
    <circle cx="496" cy="290" r="4.5" class="enqueue"/>
    <rect x="470" y="327" width="52" height="26" rx="6" class="item"/>
    <text x="496" y="344" class="in-item">item 2</text>
    <rect x="530" y="327" width="80" height="26" rx="6" class="run"/>
    <text x="570" y="344" class="in-run">runs</text>
    <use href="#deleted" x="630" y="340"/>
    <text x="630" y="372" class="under">deleted</text>

    <text x="694" y="274" class="label">mail, order 19</text>
    <path d="M694 295 L694 327" class="feed"/>
    <circle cx="694" cy="290" r="4.5" class="enqueue"/>
    <rect x="668" y="327" width="52" height="26" rx="6" class="item"/>
    <text x="694" y="344" class="in-item">item 3</text>
    <rect x="728" y="327" width="80" height="26" rx="6" class="run"/>
    <text x="768" y="344" class="in-run">runs</text>
    <use href="#deleted" x="828" y="340"/>
    <text x="828" y="372" class="under">deleted</text>
  </g>

  <line x1="40" y1="400" x2="880" y2="400" class="divider"/>

  <!-- Run -->
  <g>
    <text x="40" y="448" class="name">Run</text>
    <text x="40" y="470" class="tagline">“an operation whose</text>
    <text x="40" y="488" class="tagline">history matters”</text>
    <text x="40" y="512" class="detail">one item per enqueue, payload</text>

    <line x1="260" y1="490" x2="872" y2="490" class="axis"/>
    <use href="#arrow" x="872" y="490"/>

    <text x="296" y="424" class="label">enqueue <tspan class="mono">nightly-import</tspan></text>
    <path d="M296 445 L296 477" class="feed"/>
    <circle cx="296" cy="440" r="4.5" class="enqueue"/>
    <rect x="270" y="477" width="52" height="26" rx="6" class="item"/>
    <text x="296" y="494" class="in-item">waits</text>
    <rect x="330" y="477" width="230" height="26" rx="6" class="run"/>
    <text x="445" y="494" class="in-run">handler runs</text>

    <text x="490" y="424" class="label">same key, while active</text>
    <path d="M490 445 L490 460" class="refused-feed"/>
    <circle cx="490" cy="440" r="4.5" class="refused"/>
    <path d="M487 463 L493 469 M493 463 L487 469" class="cross"/>
    <text x="502" y="444" class="note">nothing added</text>

    <rect x="584" y="466" width="276" height="48" rx="8" class="kept"/>
    <text x="598" y="486" class="kept-head">kept with its outcome</text>
    <text x="598" y="504" class="kept-body">succeeded · started 10:00 · finished 10:03</text>
  </g>

  <line x1="40" y1="550" x2="880" y2="550" class="divider"/>

  <!-- Legend -->
  <g>
    <circle cx="46" cy="584" r="4.5" class="enqueue"/>
    <text x="58" y="588" class="legend">enqueue</text>
    <rect x="128" y="577" width="22" height="14" rx="4" class="item"/>
    <text x="158" y="588" class="legend">item waits</text>
    <rect x="248" y="577" width="22" height="14" rx="4" class="run"/>
    <text x="278" y="588" class="legend">handler runs</text>
    <rect x="378" y="581" width="22" height="6" rx="3" class="mark"/>
    <text x="408" y="588" class="legend">mark: run once more</text>
    <use href="#deleted" x="548" y="584"/>
    <text x="562" y="588" class="legend">deleted after success</text>
    <rect x="704" y="577" width="22" height="14" rx="4" class="kept"/>
    <text x="734" y="588" class="legend">kept for its retention</text>
  </g>
</svg>
