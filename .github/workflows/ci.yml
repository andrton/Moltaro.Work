name: CI

# Runs for every pull request and for every push to main, also when only documents
# changed: the "build" check is required before a merge, and a required check that does
# not run would block the pull request. See docs/work/branches.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: src

# A test that hangs instead of failing ends its job after 15 minutes instead of GitHub's
# default of six hours. The "build" job runs the tests of each provider on its database,
# a service container; the connection strings of those containers, with throwaway
# passwords, are named here and in publish.yml only (exception X1 of
# docs/work/exceptions.md). GitHub's Windows runners cannot run service containers, so
# the "windows" job runs only the tests that need no database.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # ACCEPT_EULA accepts the licence of the SQL Server image, as the owner did with
      # PQ5 of the Epic 1 plan. sqlcmd -C trusts the certificate the container made.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-throwaway-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-throwaway-1 -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      # The ping goes over TCP, which MySQL opens only once its first start has ended.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci-throwaway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      MOLTARO_WORK_POSTGRESQL: Host=localhost;Port=5432;Username=postgres;Password=ci-throwaway;Database=postgres
      MOLTARO_WORK_SQLSERVER: Server=127.0.0.1,1433;User ID=sa;Password=Ci-throwaway-1;TrustServerCertificate=True
      MOLTARO_WORK_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=ci-throwaway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet format --verify-no-changes
      - run: dotnet test --configuration Release --no-build

  # The same lane on Windows, with the tests that need no database. Only "build" is a
  # required check of main.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build --project Moltaro.Work.Tests
      - run: dotnet test --configuration Release --no-build --project Moltaro.Work.Hosting.Tests

