name: Publish

# Pushing a tag such as v0.1.0 builds, tests and publishes that version of the packages to
# nuget.org. A release is cut from main only; see docs/work/branches.md. There is no stored
# API key: nuget.org Trusted Publishing exchanges the GitHub OIDC token of this run for a
# short-lived key, under the policy the owner created on nuget.org for this repository and
# this workflow file.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Lets GitHub issue the OIDC token that NuGet/login exchanges for the short-lived key.
  id-token: write

defaults:
  run:
    working-directory: src

jobs:
  publish:
    runs-on: ubuntu-latest
    # The tests of the tag run as in CI, with the databases of the providers as service
    # containers; their throwaway connection strings are named here and in ci.yml only
    # (exception X1 of docs/work/exceptions.md).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # ACCEPT_EULA accepts the licence of the SQL Server image, as the owner did with
      # PQ5 of the Epic 1 plan. sqlcmd -C trusts the certificate the container made.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-throwaway-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-throwaway-1 -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      # The ping goes over TCP, which MySQL opens only once its first start has ended.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci-throwaway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      MOLTARO_WORK_POSTGRESQL: Host=localhost;Port=5432;Username=postgres;Password=ci-throwaway;Database=postgres
      MOLTARO_WORK_SQLSERVER: Server=127.0.0.1,1433;User ID=sa;Password=Ci-throwaway-1;TrustServerCertificate=True
      MOLTARO_WORK_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=ci-throwaway
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - name: Take the version from the tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build --configuration Release -p:Version=$PACKAGE_VERSION
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release --no-build -p:Version=$PACKAGE_VERSION --output ../artifacts
      # Right before the push: the key it returns lives for a short time only.
      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: andrton
      - name: Push to nuget.org
        run: >
          dotnet nuget push "../artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
